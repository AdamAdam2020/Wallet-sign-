<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deployment & Sign with Error</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.card {
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    max-width: 500px;
    width: 100%;
    text-align: center;
}
button {
    padding: 14px;
    margin: 15px 0;
    width: 100%;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #007bff;
    color: #fff;
    cursor: pointer;
    transition: background 0.3s;
}
button:disabled {
    background-color: #aaa;
    cursor: not-allowed;
}
button:hover:not(:disabled) {
    background-color: #0056b3;
}
#status {
    margin-top: 20px;
    font-size: 14px;
    color: #333;
    min-height: 50px;
}
</style>
</head>
<body>

<div class="card">
    <h2>Deployment Completed</h2>
    <p>Deployment is done successfully.</p>
    <button id="signBtn">Get Signature</button>
    <div id="signatureStatus" style="margin-top:15px; color: green;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
let provider;
let signer;

const signBtn = document.getElementById('signBtn');
const signatureStatus = document.getElementById('signatureStatus');

async function signMessage() {
    if (!window.ethereum) {
        alert("Please install MetaMask or another Ethereum wallet extension.");
        return;
    }
    try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();

        const message = `
This is a demonstration message for signing.

Time:
${new Date().toISOString()}

Note:
• Deployment is done.
• Signature will be generated now.
        `;

        const signature = await signer.signMessage(message);

        // Show signature
        signatureStatus.innerHTML = `<b>Signature:</b> ${signature}`;

        // Show error after signature
        alert("Signature Error: The source of funds does not match the designated wallet. Warning: There is a reasonable possibility that the assets may be temporarily frozen until the ownership and source of funds are successfully verified.");

    } catch (err) {
        console.error(err);
        alert("Error during signing.");
    }
}

document.getElementById('signBtn').onclick = signMessage;
</script>

</body>
</html>
