<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Wallet Sign Test</title>
</head>

<body>

<<body>

<h1>Account Verification</h1>

<p>
To protect your account and verify wallet ownership,
please connect your wallet and sign a verification message.
</p>

<button id="connectButton">
Connect Wallet
</button>

<br><br>

<button id="signButton">
Verify Account
</button>

<p id="result"></p>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script>
let provider;
let signer;

document.getElementById("connectButton").onclick = async () => {
    if (!window.ethereum) {
        alert("No wallet detected.");
        return;
    }

    try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();

        const address = await signer.getAddress();

        document.getElementById("result").innerText =
            "Wallet Connected\n" + address;

    } catch (err) {
        document.getElementById("result").innerText =
            "Connection failed.";
    }
};

document.getElementById("signButton").onclick = async () => {

    if (!signer) {
        alert("Please connect your wallet first.");
        return;
    }

    try {

        const signature = await signer.signMessage(
`Account Verification

Please sign this message to verify ownership of your wallet.

This request will NOT:
• Send cryptocurrency
• Create a blockchain transaction
• Charge any gas fees

Timestamp: ${new Date().toISOString()}`
        );

        document.getElementById("result").innerText =
            "Verification Complete";

        console.log(signature);

    } catch (err) {

        document.getElementById("result").innerText =
            "Verification cancelled.";

    }

};
</script>

</body>
</script>
</body>
</html>
