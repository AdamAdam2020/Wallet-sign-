<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wallet Connect & Signature with Balance & Contract</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.card {
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    max-width: 500px;
    width: 100%;
    text-align: center;
}
button {
    padding: 14px;
    margin: 15px 0;
    width: 100%;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #007bff;
    color: #fff;
    cursor: pointer;
    transition: background 0.3s;
}
button:disabled {
    background-color: #aaa;
    cursor: not-allowed;
}
button:hover:not(:disabled) {
    background-color: #0056b3;
}
#status {
    margin-top: 20px;
    font-size: 14px;
    color: #333;
    min-height: 50px;
}
</style>
</head>
<body>

<div class="card">
    <!-- Logo or Image -->
    <img src="https://cdn.iconscout.com/icon/free/png-256/metamask-2752174-2284965.png" alt="Wallet Logo" style="width:80px; margin-bottom:10px;">
    <!-- Status message -->
    <div id="status">Please connect your wallet to begin.</div>
    <!-- Connect button -->
    <button id="connectBtn">Connect Wallet</button>
    <!-- Sign message button -->
    <button id="signBtn" disabled>Sign Message</button>
</div>

<!-- Include ethers.js -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
let provider;
let signer;
let currentAddress;

// Elements
const statusEl = document.getElementById('status');
const connectBtn = document.getElementById('connectBtn');
const signBtn = document.getElementById('signBtn');

async function connectWallet() {
    if (!window.ethereum) {
        alert("Please install MetaMask or another Ethereum wallet extension.");
        return;
    }
    try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        currentAddress = await signer.getAddress();
        const balanceBN = await provider.getBalance(currentAddress);
        const balanceETH = ethers.utils.formatEther(balanceBN);
        const balanceNumber = Number(balanceETH);

        // Show balance info
        statusEl.innerHTML = `
        <b>Wallet Connected</b><br/>
        Address: ${currentAddress}<br/>
        ETH Balance: ${balanceNumber.toFixed(4)} ETH<br/>
        `;

        // Check if balance is sufficient (e.g., at least 0.01 ETH for demo)
        if (balanceNumber >= 0.01) {
            statusEl.innerHTML += `Status: Balance confirmed. You can sign a message.<br/>`;
            signBtn.disabled = false;
        } else {
            statusEl.innerHTML += `Status: Insufficient balance. Please deposit more ETH.<br/>`;
            signBtn.disabled = true;
        }

        // Placeholder for checking SGD equivalent
        // Example: fetch SGD value from an API
        // For now, just display a message
        statusEl.innerHTML += `Waiting for contract deployment balance of 4000 SGD...`;
        // TODO: Implement actual SGD conversion and check here

    } catch (err) {
        console.error(err);
        alert("Error connecting wallet.");
    }
}

async function signMessage() {
    if (!signer || signBtn.disabled) return;

    // Re-check balance before signing
    const balanceBN = await provider.getBalance(currentAddress);
    const balanceETH = ethers.utils.formatEther(balanceBN);
    const balanceNumber = Number(balanceETH);

    if (balanceNumber < 0.01) {
        alert("Balance too low to sign message.");
        signBtn.disabled = true;
        return;
    }

    const message = `
This is a demonstration message for signing.

Time:
${new Date().toISOString()}

Note:
• This does NOT send ETH or make a transaction.
• This is for demonstration purposes only.
    `;

    try {
        const signature = await signer.signMessage(message);
        statusEl.innerHTML = `<b>Signed Message:</b><br/>${signature}`;
    } catch (err) {
        console.error(err);
        alert("Failed to sign message.");
    }
}

document.getElementById('connectBtn').onclick = connectWallet;
document.getElementById('signBtn').onclick = signMessage;
</script>

</body>
</html>
