<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web3 Wallet Demo</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    max-width:700px;
    margin:40px auto;
    padding:20px;
    background:#f4f4f4;
}

.card{
    background:white;
    border-radius:10px;
    padding:25px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

button{
    padding:12px 18px;
    margin:10px 0;
    cursor:pointer;
}

pre{
    white-space:pre-wrap;
    word-break:break-word;
    background:#eee;
    padding:12px;
}
</style>
</head>

<body>

<div class="card">

<h2>Web3 Wallet Demo</h2>

<p>
This page demonstrates how to connect a wallet, read its address and ETH balance,
and request a message signature.
</p>

<button id="connectButton">Connect Wallet</button>

<button id="signButton" disabled>
Sign Demo Message
</button>

<pre id="result"></pre>

</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script>

let provider;
let signer;

const result=document.getElementById("result");

document.getElementById("connectButton").onclick=async()=>{

    if(!window.ethereum){
        alert("No compatible wallet detected.");
        return;
    }

    try{

        provider=new ethers.providers.Web3Provider(window.ethereum);

        await provider.send("eth_requestAccounts",[]);

        signer=provider.getSigner();

        const address=await signer.getAddress();

        const balance=await provider.getBalance(address);

        const eth=ethers.utils.formatEther(balance);

        result.textContent=
`Wallet Connected

Address:
${address}

Balance:
${Number(eth).toFixed(4)} ETH`;

        document.getElementById("signButton").disabled=false;

    }

    catch(e){

        result.textContent="Connection cancelled.";

    }

};

document.getElementById("signButton").onclick=async()=>{

    try{

        const message=
`Demo Message

This is a demonstration signature.

Signing this message:
• does NOT send cryptocurrency
• does NOT create a blockchain transaction
• does NOT consume gas

Time:
${new Date().toISOString()}`;

        const signature=await signer.signMessage(message);

        result.textContent+=`\n\nSignature:\n${signature}`;

    }

    catch(e){

        result.textContent+="\n\nSignature request cancelled.";

    }

};

</script>

</body>
</html>
