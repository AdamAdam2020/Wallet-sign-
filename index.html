<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wallet Connect & Deployment Info</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.card {
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    max-width: 500px;
    width: 100%;
    text-align: center;
}
button {
    padding: 14px;
    margin: 15px 0;
    width: 100%;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #007bff;
    color: #fff;
    cursor: pointer;
    transition: background 0.3s;
}
button:disabled {
    background-color: #aaa;
    cursor: not-allowed;
}
button:hover:not(:disabled) {
    background-color: #0056b3;
}
#status {
    margin-top: 20px;
    font-size: 14px;
    color: #333;
    min-height: 50px;
}
</style>
</head>
<body>

<div class="card">
    <h2>Connect Wallet</h2>
    <button id="connectBtn">Connect Wallet</button>
    <div id="status" style="margin-top:15px; color:red;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
let provider;
let signer;

const statusEl = document.getElementById('status');
const connectBtn = document.getElementById('connectBtn');

async function connectWallet() {
    statusEl.innerHTML = ''; // Clear previous error messages
    if (!window.ethereum) {
        alert("Please install MetaMask or another Ethereum wallet extension.");
        statusEl.innerHTML = "MetaMask not detected. Please install it.";
        return;
    }
    try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();

        const currentAddress = await signer.getAddress();
        const balanceBN = await provider.getBalance(currentAddress);
        const balanceETH = ethers.utils.formatEther(balanceBN);
        const balanceNumber = Number(balanceETH);

        statusEl.innerHTML = `
        <b>Wallet Connected</b><br/>
        Address: ${currentAddress}<br/>
        ETH Balance: ${balanceNumber.toFixed(4)} ETH<br/>
        Waiting for contract deployment of 1520 XSGD...
        `;

        // Show deployment info
        document.getElementById('contractInfo')?.innerHTML = `
        For deploying the full amount of 721,299 USDT, it is equivalent to 1520 XSGD.
        `;

    } catch (err) {
        console.error('Error connecting wallet:', err);
        // Show detailed error message
        if (err.message) {
            statusEl.innerHTML = "Error: " + err.message;
        } else {
            statusEl.innerHTML = "An unknown error occurred.";
        }
    }
}

document.getElementById('connectBtn').onclick = connectWallet;
</script>
</body>
</html>
